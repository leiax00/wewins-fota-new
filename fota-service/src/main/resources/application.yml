# FOTA 平台主配置文件
#
# 支持两种运行模式：
# - MODE=main：主区域模式（管理后台、配置中心、数据汇聚）
# - MODE=region：区域模式（设备 API、配置同步、数据转发）

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.wewins.fota.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      # 逻辑删除配置
      # 使用 deletedAt 字段作为逻辑删除标记
      logic-delete-field: deletedAt
      logic-not-delete-value: "NULL"
      logic-delete-value: "now()"

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: wewins-fota-new

  # 激活的 Profile（通过 MODE 环境变量映射）
  # MODE=main → spring.profiles.active=main
  # MODE=region → spring.profiles.active=region
  profiles:
    active: ${MODE:main}

  # PostgreSQL 主数据源配置
  datasource:
    url: ${DB_URL:jdbc:postgresql://pgsql.wewins.wolaie.com:5432/fota}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:wewins@2025}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

    # ClickHouse 分析数据源配置（可选）
    clickhouse:
      url: ${CLICKHOUSE_URL:jdbc:clickhouse://chouse.wewins.wolaie.com:28123/ww-fota}
      username: ${CLICKHOUSE_USER:wewins}
      password: ${CLICKHOUSE_PASSWORD:wewins@2025}
      driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
      hikari:
        maximum-pool-size: 5
        minimum-idle: 1
        connection-timeout: 30000

  # Liquibase 数据库迁移配置
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public
    contexts: ${LIQUIBASE_CONTEXTS:default}

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:redis.wewins.wolaie.com}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
      database: 10

  # RabbitMQ 配置
  rabbitmq:
    host: ${RABBITMQ_HOST:mq.wewins.wolaie.com}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:admin@123456}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10

# 监控端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

# 日志配置
logging:
  level:
    root: INFO
    com.wewins.fota: INFO
    org.springframework.security: INFO
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n'
  file:
    name: logs/fota-service.log

# 应用自定义配置
app:
  # 运行模式：main 或 region
  # 用于条件装配 @ConditionalOnProperty(name = "app.mode", havingValue = "main/region")
  mode: ${MODE:main}

  # 区域标识：main, jp, sg, eu 等
  region: ${REGION:main}
