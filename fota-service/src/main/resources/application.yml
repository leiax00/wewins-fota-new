# FOTA 平台主配置文件
#
# 支持两种运行模式（通过 app.mode 配置）：
# - app.mode=main：主区域模式（管理后台、配置中心、数据汇聚）
# - app.mode=region：区域模式（设备 API、配置同步、数据转发）

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.wewins.fota.domain.*.entity,com.wewins.fota.module.*.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      # 逻辑删除配置
      # 使用 deletedAt 字段作为逻辑删除标记
      logic-delete-field: deletedAt
      logic-not-delete-value: "NULL"
      logic-delete-value: "now()"

server:
  port: ${SERVER_PORT:8080}
  # Tomcat 最大吞咽大小（用于处理取消上传等场景）
  tomcat:
    max-swallow-size: ${TOMCAT_MAX_SWALLOW_SIZE:520MB}

spring:
  application:
    name: wewins-fota-new

  # 激活的 Profile
  # 使用 spring.profiles.active 控制环境（dev/test/prod）
  profiles:
    include: security

  # 文件上传配置
  servlet:
    multipart:
      # 单个文件最大大小（默认 200MB）
      max-file-size: ${SPRING_MULTIPART_MAX_FILE_SIZE:500MB}
      # 请求最大大小（默认 210MB，略大于单文件限制以容纳其他表单字段）
      max-request-size: ${SPRING_MULTIPART_MAX_REQUEST_SIZE:520MB}

  # PostgreSQL 主数据源配置
  # 注意：DB_URL 环境变量必须包含 TimeZone=UTC 参数，例如：
  #   jdbc:postgresql://host:port/database?TimeZone=UTC
  datasource:
    url: ${DB_URL:jdbc:postgresql://pgsql.wewins.wolaie.com:15432/fota?TimeZone=UTC}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

    # ClickHouse 分析数据源配置（可选）
    clickhouse:
      url: ${CLICKHOUSE_URL:jdbc:clickhouse://chouse.wewins.wolaie.com:28123/ww-fota}
      username: ${CLICKHOUSE_USER:wewins}
      password: ${CLICKHOUSE_PASSWORD}
      driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
      hikari:
        maximum-pool-size: 5
        minimum-idle: 1
        connection-timeout: 30000

  # Liquibase 数据库迁移配置
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public
    contexts: ${LIQUIBASE_CONTEXTS:default}

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:redis.wewins.wolaie.com}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3s
          time-between-eviction-runs: 60s
      database: 0

  # RabbitMQ 配置
  rabbitmq:
    host: ${RABBITMQ_HOST:mq.wewins.wolaie.com}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10

# 监控端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name:fota-service}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99

# 日志配置
logging:
  level:
    root: INFO
    com.wewins.fota: INFO
    org.springframework.security: INFO
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n'
  file:
    name: logs/fota-service.log

# 应用自定义配置
app:
  # 运行模式：main 或 region
  # 用于条件装配 @ConditionalOnProperty(name = "app.mode", havingValue = "main/region")
  mode: ${APP_MODE:main}

  # 节点配置（main 和 region 共用）
  node:
    code: ${NODE_CODE:main}
    name: ${NODE_NAME:主区域}
    baseUrl: ${NODE_BASE_URL:https://main.api.xxx.com}
    timeZone: ${NODE_TIME_ZONE:Asia/Shanghai}


  # 服务注册
  registry:
    enabled: ${REGISTRY_ENABLED:true}
    ttlSeconds: ${REGISTRY_TTL_SECONDS:90}
    heartbeatIntervalMs: ${REGISTRY_HEARTBEAT_INTERVAL_MS:30000}

  monitoring:
    prometheus:
      enabled: ${PROMETHEUS_ENABLED:true}
      url: ${PROMETHEUS_URL:http://localhost:19090}

  # 分区主节点选举
  leader:
    enabled: ${LEADER_ENABLED:true}
    ttlSeconds: ${LEADER_TTL_SECONDS:30}
    renewIntervalMs: ${LEADER_RENEW_INTERVAL_MS:10000}

  # 内部接口鉴权
  internal-auth:
    enabled: ${INTERNAL_AUTH_ENABLED:true}
    skewSeconds: ${INTERNAL_AUTH_SKEW_SECONDS:300}
    nonceTtlSeconds: ${INTERNAL_AUTH_NONCE_TTL_SECONDS:300}

  # 消息队列配置
  mq:
    enabled: ${MQ_ENABLED:true}
    queues:
      upgrade-events:
        name: ${MQ_UPGRADE_EVENT_QUEUE:fota.upgrade.events}
        durable: true
      check-logs:
        name: ${MQ_CHECK_LOG_QUEUE:fota.device.check.logs}
        durable: true
    publish:
      mandatory: ${MQ_PUBLISH_MANDATORY:false}

  # 对象存储配置
  storage:
    defaultTtlSeconds: ${STORAGE_DEFAULT_TTL_SECONDS:3600}
    local:
      baseDir: ${STORAGE_LOCAL_BASE_DIR:data/storage}
    s3:
      enabled: ${STORAGE_S3_ENABLED:true}
      endpoint: ${STORAGE_S3_ENDPOINT:https://oss.wewins.wolaie.com}
      region: ${STORAGE_S3_REGION:us-east-1}
      bucket: ${STORAGE_S3_BUCKET:fota}
      accessKey: ${STORAGE_S3_ACCESS_KEY}
      secretKey: ${STORAGE_S3_SECRET_KEY}
      pathStyleAccessEnabled: ${STORAGE_S3_PATH_STYLE:true}

  # 缓存配置
  cache:
    # 设备活跃度 Bitmap TTL（默认 90 天）
    bitmap-ttl: ${APP_CACHE_BITMAP_TTL:90d}
    # Bitmap 保留天数（默认 90 天）
    bitmap-keep-days: ${APP_CACHE_BITMAP_KEEP_DAYS:90}
    # 策略缓存 TTL（默认 1 小时）
    policy-ttl: ${APP_CACHE_POLICY_TTL:1h}
    # 限流默认窗口大小（默认 60 秒）
    default-rate-limit-window: ${APP_CACHE_DEFAULT_RATE_LIMIT_WINDOW:60s}
    device-evict-mode: ${APP_CACHE_DEVICE_EVICT_MODE:collection}
    device-evict-batch-size: ${APP_CACHE_DEVICE_EVICT_BATCH_SIZE:500}

  # 固件下载配置
  firmware:
    download:
      # 签名模式：self-signed（自签名）或 s3-presigned（S3 预签名）或 none (不签名)
      sign-mode: ${FIRMWARE_DOWNLOAD_SIGN_MODE:none}
      # RustFS/CDN 基础域名（用于拼接完整下载 URL）
      # 优先使用环境变量，未配置时回退到 S3 endpoint
      base-url: ${FIRMWARE_DOWNLOAD_BASE_URL:${app.storage.s3.endpoint:}}
      # 自签名配置
      self-signed:
        secret-key: ${FIRMWARE_SIGN_SECRET:-}
        default-expire-seconds: ${FIRMWARE_SELF_SIGNED_EXPIRE:86400}
      # S3 预签名配置
      s3-presigned:
        default-expire-seconds: ${FIRMWARE_S3_PRESIGNED_EXPIRE:3600}
    # 上传清理配置
    upload:
      cleanup:
        enabled: ${APP_FIRMWARE_UPLOAD_CLEANUP_ENABLED:true}
        temp-dir: ${APP_FIRMWARE_UPLOAD_TEMP_DIR:data/storage/tmp}
        max-file-age: ${APP_FIRMWARE_UPLOAD_MAX_FILE_AGE:2h}
        cron: ${APP_FIRMWARE_UPLOAD_CLEANUP_CRON:0 */30 * * * *}
