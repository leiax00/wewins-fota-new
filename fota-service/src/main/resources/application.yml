# FOTA 平台主配置文件
#
# 支持两种运行模式：
# - MODE=main：主区域模式（管理后台、配置中心、数据汇聚）
# - MODE=region：区域模式（设备 API、配置同步、数据转发）

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: wewins-fota-new

  # 激活的 Profile（通过 MODE 环境变量映射）
  # MODE=main → spring.profiles.active=main
  # MODE=region → spring.profiles.active=region
  profiles:
    active: ${MODE:main}

  # PostgreSQL 数据源配置
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fota}
    username: ${DB_USER:fota}
    password: ${DB_PASSWORD:fota}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  # MyBatis-Plus 配置
  mybatis-plus:
    mapper-locations: classpath:mapper/**/*.xml  # Mapper XML 文件位置
    type-aliases-package: com.wewins.fota.database.entity  # 实体类包路径
    configuration:
      map-underscore-to-camel-case: true  # 开启驼峰命名转换
      log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl  # 使用 SLF4J 日志

  # Liquibase 数据库迁移配置
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public
    contexts: ${LIQUIBASE_CONTEXTS:default}

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  # RabbitMQ 配置
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10

  # Flyway 数据库迁移配置
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# 监控端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# 日志配置
logging:
  level:
    root: INFO
    com.wewins.fota: INFO
    org.springframework.security: INFO
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n'
  file:
    name: logs/fota-service.log

# 应用自定义配置
app:
  # 运行模式：main 或 region
  # 用于条件装配 @ConditionalOnProperty(name = "app.mode", havingValue = "main/region")
  mode: ${MODE:main}

  # 区域标识：main, jp, sg, eu 等
  region: ${REGION:main}
