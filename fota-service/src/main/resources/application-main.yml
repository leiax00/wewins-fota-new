# 主区域模式配置（MODE=main）
#
# 主区域职责：
# - 管理后台（产品、策略、固件、设备管理）
# - 配置中心（版本查询、快照拉取）
# - 数据汇聚（跨区域汇总数据接入）
#
# 使用说明：通过 spring.profiles.active=main 加载此配置文件

# 主区域模式标识
app:
  mode: main

  # 主区域 API 配置
  main:
    apiBaseUrl: https://main.api.xxx.com

    # 子区域注册表
    regions:
      - code: us-east
        name: 美国东部区域
        apiBaseUrl: https://region-us-east.api.xxx.com
        timeZone: America/New_York
        status: active
      - code: eu-west
        name: 欧洲西部区域
        apiBaseUrl: https://region-eu-west.api.xxx.com
        timeZone: Europe/Paris
        status: active
      - code: ap-southeast
        name: 亚太东南区域
        apiBaseUrl: https://region-ap-southeast.api.xxx.com
        timeZone: Asia/Singapore
        status: active

  # 集群配置
  cluster:
    enabled: true
    lock:
      prefix: fota:lock:
      leaseTime: 30
    leader:
      enabled: true
      renewInterval: 10

# 功能开关（主区域）
feature:
  admin:
    enabled: true  # 管理后台
  ingest:
    enabled: true  # 跨区域数据接入
  forwarder:
    enabled: false # Forwarder 仅在 region 启用
