# 主区域模式配置（MODE=main）
#
# 主区域职责：
# - 管理后台（产品、策略、固件、设备管理）
# - 配置中心（版本查询、快照拉取）
# - 数据汇聚（跨区域汇总数据接入）
#
# 使用说明：通过 spring.profiles.active=main 加载此配置文件

# 应用配置
app:
  mode: main

  # 节点配置（main 和 region 共用）
  node:
    code: main
    name: 主区域
    baseUrl: https://main.api.xxx.com
    timeZone: Asia/Shanghai

  # 功能开关
  features:
    admin: true      # 管理后台
    device-api: false
    data-ingest: true
    data-forward: false
