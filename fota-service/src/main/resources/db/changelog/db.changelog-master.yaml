databaseChangeLog:
  # Liquibase 主 changelog 配置文件
  # 用于管理 FOTA 系统的数据库迁移脚本
  #
  # 命名规范:
  # - 文件名格式: V{version}__{description}.sql
  # - 示例: V1__init_core.sql, V2__add_user_table.sql
  #
  # 执行顺序:
  # 1. 按照 changesets 定义的顺序执行
  # 2. 每个 changeset 有唯一的 id 和 author
  # 3. 执行记录保存在 databasechangelog 表中

  - changeSet:
      id: V1__init_core
      author: fota-team
      comments: 初始化核心表结构（products, devices, firmware_versions, upgrade_policies）
      changes:
        - sqlFile:
            path: changes/V1__init_core.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            stripComments: true

  # 预留后续 changeset 位置
  # 示例:
  # - changeSet:
  #     id: V2__add_user_table
  #     author: fota-team
  #     changes:
  #       - sqlFile:
  #           path: changes/V2__add_user_table.sql
  #           relativeToChangelogFile: true
