databaseChangeLog:
  # Liquibase 主 changelog 配置文件
  # 用于管理 FOTA 系统的数据库迁移脚本
  #
  # 命名规范:
  # - 文件名格式: yyyyMMdd_{version}__{description}.sql  (version按每日的序号，两位数字)
  # - 示例: 0260209_01_init_core.sql, 20260209_02_init_system_tables.sql
  #
  # 执行顺序:
  # 1. 按照 changesets 定义的顺序执行
  # 2. 每个 changeset 有唯一的 id 和 author
  # 3. 执行记录保存在 databasechangelog 表中

  - changeSet:
      id: 20260209_01_init_core
      author: fota-team
      comment: 初始化核心表结构（products, devices, firmware_versions, upgrade_policies）
      changes:
        - sqlFile:
            path: changes/20260209_01_init_core.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            stripComments: true

  - changeSet:
      id: 20260209_02_init_system_tables
      author: fota-team
      comment: 初始化系统管理模块核心表结构（users, roles, permissions, dict）
      changes:
        - sqlFile:
            path: changes/20260209_02_init_system_tables.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            stripComments: true

  - changeSet:
      id: 20260209_03_init_data
      author: fota-team
      comment: 初始化系统管理模块数据（权限、角色、管理员、字典）
      changes:
        - sqlFile:
            path: changes/20260209_03_init_data.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            stripComments: true

  - changeSet:
      id: 20260220_01_init_fota_permissions
      author: fota-team
      comment: 初始化 FOTA 业务模块权限（dashboard/product/firmware/policy/device）
      changes:
        - sqlFile:
            path: changes/20260220_01_init_fota_permissions.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            stripComments: true

  - changeSet:
      id: 20260224_01_fix_system_sequences
      author: fota-team
      comment: 修复系统管理模块序列漂移（避免主键冲突）
      changes:
        - sqlFile:
            path: changes/20260224_01_fix_system_sequences.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            stripComments: true

  - changeSet:
      id: 20260224_02_add_menu_fields
      author: fota-team
      comment: 为 sys_permissions 表添加菜单路由字段（支持动态菜单）
      changes:
        - sqlFile:
            path: changes/20260224_02_add_menu_fields.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            stripComments: true

  - changeSet:
      id: 20260224_03_bind_menu_permissions
      author: fota-team
      comment: 为角色补充 MODULE/MENU 类型的菜单权限（符合"选中子节点必定选中父节点"的业务约定）
      changes:
        - sqlFile:
            path: changes/20260224_03_bind_menu_permissions.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            stripComments: true

  - changeSet:
      id: 20260224_05_add_menu_config_examples
      author: fota-team
      comment: 添加完整的菜单配置示例（包含 breadcrumbHidden、tabHidden、tabClosable 字段）
      changes:
        - sqlFile:
            path: changes/20260224_05_add_menu_config_examples.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            stripComments: true

  - changeSet:
      id: 20260225_01_upgrade_policy_add_plan_time_status
      author: fota-team
      comment: 升级策略表新增 plan_time 与 status 字段，支持策略基础 CRUD
      changes:
        - sqlFile:
            path: changes/20260225_01_upgrade_policy_add_plan_time_status.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            stripComments: true

  - changeSet:
      id: 20260225_02_init_json_schema_dict_types
      author: fota-team
      comment: "初始化 JSON 字段配置化字典类型（MVP: 设备 tags、固件 tags/meta）"
      changes:
        - sqlFile:
            path: changes/20260225_02_init_json_schema_dict_types.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            stripComments: true

  - changeSet:
      id: 20260225_03_json_schema_examples
      author: fota-team
      comment: "初始化 JSON 字段配置示例数据（MVP: 设备 tags 和固件 tags 字段定义）"
      changes:
        - sqlFile:
            path: changes/20260225_03_json_schema_examples.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            stripComments: true

  - changeSet:
      id: 20260225_04_supported_languages
      author: fota-team
      comment: "初始化支持的语言字典（用于 i18n 字段的语言选项）"
      changes:
        - sqlFile:
            path: changes/20260225_04_supported_languages.sql
