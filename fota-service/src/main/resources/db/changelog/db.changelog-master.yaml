databaseChangeLog:
  # 当前版本已切换到 baseline 模式。
  # 新环境初始化只执行 baseline；
  # 后续增量变更统一追加到 changes/incremental/ 并在此文件中继续登记。
  # 命名规范:
  # - 文件名格式: yyyyMMdd_{version}_{description}.sql  (version按每日的序号，两位数字)
  # - 示例: 0260209_01_init_core.sql, 20260209_02_init_system_tables.sql

  - changeSet:
      id: 20260321_01_baseline
      author: fota-team
      comment: "数据库基线版本：包含当前系统的完整表结构、索引、初始化权限"
      changes:
        - sqlFile:
            path: changes/pgsql/baseline/20260321_01_baseline.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            stripComments: true

  - changeSet:
      id: 20260321_01_initdata
      author: fota-team
      comment: "种子数据"
      changes:
        - sqlFile:
            path: changes/pgsql/baseline/20260321_01_initdata.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            stripComments: true

  - changeSet:
      id: 20260321_01_reset_seq_after_init
      author: fota-team
      comment: "设置包含种子数据表的序列起始id"
      changes:
        - sqlFile:
            path: changes/pgsql/baseline/20260321_01_reset_seq_after_init.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            stripComments: true

