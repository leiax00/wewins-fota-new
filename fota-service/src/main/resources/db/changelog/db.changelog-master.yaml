databaseChangeLog:
  # =============================================
  # FOTA 数据库迁移主配置
  # =============================================
  # 支持多数据库：PostgreSQL、MySQL
  # 通过 dbms 属性区分不同数据库的变更
  #
  # 命名规范:
  # - 文件名格式: yyyyMMdd_{version}_{description}.sql
  # - version 按每日的序号，两位数字
  # - 示例: 20260209_01_init_core.sql
  # =============================================

  # =============================================
  # PostgreSQL 变更
  # =============================================
  - changeSet:
      id: 20260321_01_baseline_pgsql
      author: fota-team
      dbms: postgresql
      comment: "PostgreSQL 数据库基线版本：包含完整表结构、索引"
      changes:
        - sqlFile:
            path: changes/pgsql/baseline/20260321_01_baseline.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            stripComments: true

  - changeSet:
      id: 20260321_01_initdata_pgsql
      author: fota-team
      dbms: postgresql
      comment: "PostgreSQL 种子数据"
      changes:
        - sqlFile:
            path: changes/pgsql/baseline/20260321_01_initdata.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            stripComments: true

  - changeSet:
      id: 20260321_01_reset_seq_pgsql
      author: fota-team
      dbms: postgresql
      comment: "PostgreSQL 设置包含种子数据表的序列起始id"
      changes:
        - sqlFile:
            path: changes/pgsql/baseline/20260321_01_reset_seq_after_init.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            stripComments: true

  # =============================================
  # MySQL 变更
  # =============================================
  - changeSet:
      id: 20260321_01_baseline_mysql
      author: fota-team
      dbms: mysql
      comment: "MySQL 数据库基线版本：包含完整表结构、索引、拆行表"
      changes:
        - sqlFile:
            path: changes/mysql/baseline/20260321_01_baseline.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            stripComments: true

  - changeSet:
      id: 20260321_01_initdata_mysql
      author: fota-team
      dbms: mysql
      comment: "MySQL 种子数据"
      changes:
        - sqlFile:
            path: changes/mysql/baseline/20260321_01_initdata.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            stripComments: true

  # =============================================
  # 通用变更（两种数据库都执行）
  # =============================================
  - include:
      file: changes/common/20260322_01_change_deleted_column.yaml
      relativeToChangelogFile: true

  - include:
      file: changes/common/20260322_02_add_relation_tables.yaml
      relativeToChangelogFile: true
