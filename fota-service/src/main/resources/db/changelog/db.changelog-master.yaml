databaseChangeLog:
  # 当前版本已切换到 baseline 模式。
  # 新环境初始化只执行 baseline；
  # 后续增量变更统一追加到 changes/incremental/ 并在此文件中继续登记。
  # 命名规范:
  # - 文件名格式: yyyyMMdd_{version}__{description}.sql  (version按每日的序号，两位数字)
  # - 示例: 0260209_01_init_core.sql, 20260209_02_init_system_tables.sql

  - changeSet:
      id: 20260312_01_baseline
      author: fota-team
      comment: "数据库基线版本：包含当前系统的完整表结构、索引、初始化权限与种子数据"
      changes:
        - sqlFile:
            path: changes/baseline/20260312_01_baseline.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            stripComments: true

  - changeSet:
      id: 20260313_01_operation_logs
      author: fota-team
      comment: "新增后台操作日志表，用于审计查询"
      changes:
        - sqlFile:
            path: changes/incremental/20260313_01__create_sys_operation_logs.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            stripComments: true

  - changeSet:
      id: 20260314_01_seed_load_control_dicts
      author: fota-team
      comment: "初始化负载控制字典类型与默认配置项"
      changes:
        - sqlFile:
            path: changes/incremental/20260314_01__seed_load_control_dicts.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            stripComments: true

  - changeSet:
      id: 20260317_01_reset_sequences
      author: fota-team
      comment: "基线数据插入后重置序列位置，预留 ID 空间便于后续手动新增"
      changes:
        - sqlFile:
            path: changes/incremental/20260317_01__reset_sequences_after_baseline.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            stripComments: true
