databaseChangeLog:
  # =============================================
  # 逻辑删除字段变更：deleted_at -> deleted
  # 将时间戳类型改为 0/1 标志，兼容多数据库
  # =============================================

  - changeSet:
      id: 20260322_01_add_deleted_column_to_products
      author: fota-team
      comment: "products 表添加 deleted 字段"
      changes:
        - addColumn:
            tableName: products
            columns:
              - column:
                  name: deleted
                  type: SMALLINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

  - changeSet:
      id: 20260322_02_migrate_products_deleted
      author: fota-team
      comment: "迁移 products 表的 deleted_at 数据到 deleted"
      changes:
        - sql:
            sql: UPDATE products SET deleted = 1 WHERE deleted_at IS NOT NULL;

  - changeSet:
      id: 20260322_03_drop_deleted_at_from_products
      author: fota-team
      comment: "删除 products 表的 deleted_at 字段"
      changes:
        - dropColumn:
            tableName: products
            columnName: deleted_at

