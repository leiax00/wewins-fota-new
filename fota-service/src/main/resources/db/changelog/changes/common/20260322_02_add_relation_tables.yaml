databaseChangeLog:
  - changeSet:
      id: 20260322_28_create_device_tags
      author: fota-team
      comment: "创建设备标签关联表 device_tags"
      preConditions:
        onFail: MARK_RAN
        onError: HALT
        - not:
            - tableExists:
                tableName: device_tags
      changes:
        - createTable:
            tableName: device_tags
            remarks: "设备标签关联表"
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_device_tags
                    nullable: false
              - column:
                  name: device_id
                  type: BIGINT
                  remarks: "设备ID"
                  constraints:
                    nullable: false
              - column:
                  name: tag_key
                  type: VARCHAR(64)
                  remarks: "标签键"
                  constraints:
                    nullable: false
              - column:
                  name: tag_value
                  type: VARCHAR(255)
                  remarks: "标签值"
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addUniqueConstraint:
            tableName: device_tags
            columnNames: device_id, tag_key
            constraintName: uk_device_tags_device_key

  - changeSet:
      id: 20260322_29_add_device_tags_indexes
      author: fota-team
      comment: "为设备标签关联表添加索引"
      preConditions:
        onFail: MARK_RAN
        onError: HALT
        - tableExists:
            tableName: device_tags
      changes:
        - createIndex:
            tableName: device_tags
            indexName: idx_device_tags_kv_device
            columns:
              - column:
                  name: tag_key
              - column:
                  name: tag_value
              - column:
                  name: device_id
        - createIndex:
            tableName: device_tags
            indexName: idx_device_tags_device_id
            columns:
              - column:
                  name: device_id

  - changeSet:
