            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_device_version_parts
                    nullable: false
              - column:
                  name: device_id
                  type: BIGINT
                  remarks: "设备ID"
                  constraints:
                    nullable: false
              - column:
                  name: part_name
