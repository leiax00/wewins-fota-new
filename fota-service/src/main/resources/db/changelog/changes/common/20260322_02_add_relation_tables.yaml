                  name: version_id
        - createIndex:
            tableName: device_version_parts
            indexName: idx_dvp_part_version
            columns:
              - column:
                  name: part_name
              - column:
                  name: version_id
        - createIndex:
            tableName: device_version_parts
            indexName: idx_dvp_device_primary
            columns:
              - column:
                  name: device_id
              - column:
                  name: is_primary

