                  remarks: "组件名称"
                  constraints:
                    nullable: false
              - column:
                  name: version_id
                  type: BIGINT
                  remarks: "固件版本ID"
              - column:
                  name: version
                  type: VARCHAR(50)
                  remarks: "版本号快照"
                  constraints:
                    nullable: false
              - column:
                  name: internal_version
                  type: VARCHAR(255)
                  remarks: "内部版本号快照"
              - column:
                  name: is_primary
                  type: SMALLINT
                  defaultValueNumeric: 0
                  remarks: "是否为主版本分片"
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addUniqueConstraint:
            tableName: device_version_parts
            columnNames: device_id, part_name
            constraintName: uk_device_version_parts_device_part

  - changeSet:
      id: 20260322_31_add_device_version_parts_indexes
