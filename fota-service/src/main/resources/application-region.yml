# 区域模式配置（MODE=region）
#
# 区域职责：
# - 设备 API（check/report）
# - 配置同步（从主区域轮询配置）
# - 数据转发（Forwarder 转发数据到主区域）
#
# 使用说明：通过 spring.profiles.active=region 加载此配置文件

# 应用配置
app:
  mode: region

  # 节点配置（区域模式）
  node:
    code: ${NODE_CODE:us-east}
    name: ${NODE_NAME:美东区域}
    baseUrl: ${NODE_BASE_URL:https://us-east.api.xxx.com}
    timeZone: ${NODE_TIME_ZONE:America/New_York}

  # 主区域入口（region 模式必须配置）
  main:
    baseUrl: ${APP_MAIN_BASE_URL:https://main.api.xxx.com}
    bootstrapSecret: ${APP_MAIN_BOOTSTRAP_SECRET:change-me}

  features:
    admin: false
    device-api: true
    data-ingest: false
    data-forward: true

# 区域模式禁用 Liquibase（由主区域管理迁移）
spring:
  liquibase:
    enabled: false
