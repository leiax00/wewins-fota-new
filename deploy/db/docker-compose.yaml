name: fota-db

services:
  redis-stack:
    image: redis/redis-stack
    container_name: redis
    restart: unless-stopped
    environment: { }
    #      - REDIS_ARGS="--requirepass wewins@123"
    ports:
      - "6379:6379"
      - "28001:8001"
    volumes:
      - ${DEV_DIR}/redis-stack/data:/data
    #      - ./redis-stack.conf:/redis-stack.conf
    networks:
      - ww-net


  pgsql:
    profiles:
      - pgsql
    image: postgres:18-bookworm
    container_name: pgsql
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${WW_PASSWORD:-wewins@123}
    ports:
      - '5432:5432'
    volumes:
      - ${DEV_DIR}/pgsql:/var/lib/postgresql  # 18+
    #      - ${DEV_NB_DIR}/pgsql/data:/var/lib/postgresql/data
    networks:
      - ww-net

  mysql:
    profiles:
      - mysql
    image: mysql:9.4.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${WW_PASSWORD:-wewins@123}
    ports:
      - '3306:3306'
    volumes:
      - ${DEV_DIR}/mysql/data:/var/lib/mysql
    networks:
      - ww-net

  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    container_name: clickhouse
    restart: unless-stopped
    ports:
      - "18123:8123"
      - "19000:9000"
    environment:
      - CLICKHOUSE_USER=${WW_USERNAME:-wewins}
      - CLICKHOUSE_PASSWORD=${WW_PASSWORD:-wewins@123}
    volumes:
      - ${DEV_DIR}/clickhouse/data:/var/lib/clickhouse
      - ${DEV_DIR}/clickhouse/logs:/var/log/clickhouse-server
      - ${PWD}/clickhouse/config.xml:/etc/clickhouse-server/config.d/self-config.xml
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    mem_limit: 4g
    cpus: 2.0
    # swarm 生效
    #    deploy:
    #      resources:
    #        limits:
    #          cpus: "2.0"
    #          memory: 4g
    networks:
      - ww-net

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs-server
    privileged: true
    user: root
    ports:
      - "9000:9000" # S3 API port
      - "9001:9001" # Console port
    environment:
      #      - RUSTFS_VOLUMES=/data/rustfs
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_EXTERNAL_ADDRESS=:9000
      - RUSTFS_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_ACCESS_KEY=${WW_USERNAME:-wewins}        # CHANGEME
      - RUSTFS_SECRET_KEY=${WW_PASSWORD:-wewins@123}    # CHANGEME
      - RUSTFS_OBS_LOGGER_LEVEL=info
      - RUSTFS_TLS_PATH=/opt/tls
      # Object Cache
      - RUSTFS_OBJECT_CACHE_ENABLE=true
      - RUSTFS_OBJECT_CACHE_TTL_SECS=300

    volumes:
      - ${DEV_DIR}/rustfs/data:/data
      - ${DEV_DIR}/rustfs/logs:/logs
    networks:
      - ww-net
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "sh", "-c",
          "curl -f http://localhost:9000/health && curl -f http://localhost:9001/rustfs/console/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  ww-net:
    external: true
