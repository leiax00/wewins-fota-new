name: fota-infra

services:
  # ================================
  # Redis
  # ================================
  redis-stack:
    image: redis/redis-stack
    restart: unless-stopped
    environment: { }
    #      - REDIS_ARGS="--requirepass wewins@123"
    ports:
      - "6379:6379"
      - "28001:8001"
    volumes:
      - ${DEV_DIR:-/workspace/devData}/redis-stack/data:/data
    networks:
      - self

  # ================================
  # PostgreSQL
  # ================================
  pgsql:
    profiles:
      - pgsql
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${WW_PASSWORD:-wewins@123}
    ports:
      - '5432:5432'
    volumes:
      - ${PWD}/pgsql/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
      - ${DEV_DIR:-/workspace/devData}/pgsql:/var/lib/postgresql  # 18+
    #      - ${DEV_NB_DIR}/pgsql/data:/var/lib/postgresql/data
    networks:
      - self

  # ================================
  # MySQL（备用）
  # ================================
  mysql:
    profiles:
      - mysql
    image: mysql:9.4.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${WW_PASSWORD:-wewins@123}
    ports:
      - '3306:3306'
    volumes:
      - ${DEV_DIR:-/workspace/devData}/mysql/data:/var/lib/mysql
    networks:
      - self

  # ================================
  # ClickHouse
  # ================================
  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    restart: unless-stopped
    ports:
      - "18123:8123"
      - "19000:9000"
    environment:
      - CLICKHOUSE_USER=${WW_USERNAME:-wewins}
      - CLICKHOUSE_PASSWORD=${WW_PASSWORD:-wewins@123}
    volumes:
      - ${DEV_DIR:-/workspace/devData}/clickhouse/data:/var/lib/clickhouse
      - ${DEV_DIR:-/workspace/devData}/clickhouse/logs:/var/log/clickhouse-server
      - ${PWD}/clickhouse/config.xml:/etc/clickhouse-server/config.d/self-config.xml
      - ${PWD}/../../fota-service/src/main/resources/db/clickhouse/01_create_tables.sql:/docker-entrypoint-initdb.d/01_create_tables.sql
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    mem_limit: 4g
    cpus: 2.0
    networks:
      - self

  # ================================
  # RustFS (S3兼容存储)
  # ================================
  rustfs:
    image: rustfs/rustfs:latest
    privileged: true
    user: root
    ports:
      - "9000:9000" # S3 API port
      - "9001:9001" # Console port
    environment:
      #      - RUSTFS_VOLUMES=/data/rustfs
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_EXTERNAL_ADDRESS=:9000
      - RUSTFS_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_ACCESS_KEY=${WW_USERNAME:-wewins}        # CHANGEME
      - RUSTFS_SECRET_KEY=${WW_PASSWORD:-wewins@123}    # CHANGEME
      - RUSTFS_OBS_LOGGER_LEVEL=info
      - RUSTFS_TLS_PATH=/opt/tls
      # Object Cache
      - RUSTFS_OBJECT_CACHE_ENABLE=true
      - RUSTFS_OBJECT_CACHE_TTL_SECS=300
    volumes:
      - ${DEV_DIR:-/workspace/devData}/rustfs/data:/data
      - ${DEV_DIR:-/workspace/devData}/rustfs/logs:/logs
    networks:
      - self
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "sh", "-c",
          "curl -f http://localhost:9000/health && curl -f http://localhost:9001/rustfs/console/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ================================
  # RabbitMQ 消息队列
  # ================================
  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${WW_USERNAME:-wewins}
      RABBITMQ_DEFAULT_PASS: ${WW_PASSWORD:-wewins@123}
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ${DEV_DIR:-/workspace/devData}/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - self

  # ================================
  # Nginx Proxy Manager（反向代理）
  # ================================
  npm:
    profiles:
      - npm
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - '${NPM_HTTP_PORT:-80}:80'     # HTTP
      - '${NPM_HTTPS_PORT:-443}:443'   # HTTPS
      - '${NPM_CONSOLE_PORT:-81}:81'   # 管理界面
    environment:
      # 使用 SQLite 数据库
      DISABLE_IPV6: 'true'
    volumes:
      - ${DEV_DIR:-/workspace/devData}/fota/npm/data:/data
      - ${DEV_DIR:-/workspace/devData}/fota/npm/letsencrypt:/etc/letsencrypt
    networks:
      - self
networks:
  self:
    external: true
