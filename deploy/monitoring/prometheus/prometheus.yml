# Prometheus 配置文件
# 使用 File-based Service Discovery 进行灵活的 target 管理

global:
  # 抓取间隔（默认 15 秒）
  scrape_interval: 15s
  # 告警规则评估间隔
  evaluation_interval: 15s
  # 全局标签
  external_labels:
    cluster: 'fota-prod'

# 告警管理器配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# 告警规则文件
rule_files:
  - /etc/prometheus/alerts/*.yml

# 抓取配置
scrape_configs:
  # FOTA 服务实例 - 使用文件服务发现
  - job_name: 'fota-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    honor_labels: true
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/fota-services.json
        refresh_interval: 30s

  # Node Exporter - 使用文件服务发现
  - job_name: 'node-exporter'
    scrape_interval: 15s
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/node-exporters.json
        refresh_interval: 30s

  # cAdvisor - 使用文件服务发现
  - job_name: 'cadvisor'
    scrape_interval: 15s
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/cadvisors.json
        refresh_interval: 30s

  # Prometheus 自监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          cluster: 'fota-prod'
